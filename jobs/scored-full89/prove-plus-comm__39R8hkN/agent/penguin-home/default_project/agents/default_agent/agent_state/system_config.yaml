# Fair rematch pin: match official dshmin 7/8 card (skills off, short prompt,
# bash+editor tools only, max thinking, 256k out).
version: 1
kernel_version: 2026-08-11
system_prompt: |
  You are a helpful software engineer assistant.
max_turns: 90
model:
  max_tokens: 256000
  thinking_level: xhigh
  timeoutMs: 900000
compaction:
  max_context_length: 128000
  max_session_turns: -1
  mode: summarize
memory:
  enabled: false
vault:
  enabled: false
skills:
  enabled: false
schedules:
  enabled: false
tools:
  builtin:
    - name: read_file
      description: Read a text file and return its content with line numbers (cat -n style).
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: Path to the file to read; absolute, or relative to the workspace.
          offset:
            type: number
            description: 1-based line number to start reading from; defaults to 1.
          limit:
            type: number
            description: Max lines to read; defaults to 2000.
        required:
          - file_path
      permission: r
      timeoutMs: 30000
      maxOutputLength: 64000
    - name: edit_file
      description: Edit a file by exact string replacement.
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: Path to the file to edit.
          old_string:
            type: string
            description: Exact text to replace.
          new_string:
            type: string
            description: Replacement text.
          replace_all:
            type: boolean
            description: Replace every occurrence; defaults to false.
        required:
          - file_path
          - old_string
          - new_string
      permission: rw
      timeoutMs: 30000
      maxOutputLength: 16000
    - name: write_file
      description: Create or overwrite a file.
      parameters:
        type: object
        properties:
          file_path:
            type: string
          content:
            type: string
        required:
          - file_path
          - content
      permission: rw
      timeoutMs: 30000
      maxOutputLength: 16000
    - name: exec_command
      description: Run a shell command in the workspace. Persistent bash analogue of dshmin.
      parameters:
        type: object
        properties:
          description:
            type: string
          cmd:
            type: string
          workdir:
            type: string
          yield_time_ms:
            type: number
        required:
          - description
          - cmd
      permission: rw
      call_description: true
      timeoutMs: 300000
      maxOutputLength: 16000
    - name: input_command
      description: Interact with a running exec_command session.
      parameters:
        type: object
        properties:
          description:
            type: string
          process_id:
            type: string
          chars:
            type: string
          yield_time_ms:
            type: number
        required:
          - description
          - process_id
      permission: rw
      call_description: true
      timeoutMs: 300000
      maxOutputLength: 16000
  mcpServers: []
